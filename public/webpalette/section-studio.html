<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('wp-ui');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-ui',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<title>Section Studio — WebPalette</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23141414'/%3E%3Crect x='13' y='5' width='6' height='20' rx='3' fill='%23EFE9DF' transform='rotate(-30 16 25)'/%3E%3Crect x='13' y='5' width='6' height='20' rx='3' fill='%238C8C8C' transform='rotate(-8 16 25)'/%3E%3Crect x='13' y='5' width='6' height='20' rx='3' fill='%23D63A1F' transform='rotate(16 16 25)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="studio.css">
<style>
body{overflow:hidden}
.bs{display:grid;grid-template-columns:300px 1fr 440px;grid-template-rows:56px 1fr;height:100vh}
.bs__top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.bs__top a.btn{text-decoration:none}.bs__count{margin-left:auto;color:var(--ink-3);font-size:12px}
.bs__tabs{margin-left:10px}
.bs__side{overflow:auto;padding:12px;background:var(--panel);border-right:1px solid var(--line);display:grid;align-content:start;gap:10px}
.bs__grp{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}
.bs__grp h3{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.bs__f{display:grid;gap:4px}.bs__f select,.bs__f input.input{width:100%}
.bs__hint{color:var(--ink-3);font-size:11.5px;line-height:1.45;margin:0}
.bs__checks{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:12px}
.bs__acts{display:flex;flex-wrap:wrap;gap:6px}
.bs__niche p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.45}
.bs__main{display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;padding:12px 16px;min-height:0;overflow:hidden}
.bs__theme{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.bs__stage,.bs__gal{width:100%;height:100%;min-height:360px;border:1px solid var(--line);border-radius:12px;background:#fff}
.bs__gal{grid-row:3/5}
.bs__tip{margin:0;color:var(--ink-3);font-size:12px}
.bs__right{display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0;overflow:hidden;padding:12px 14px;background:var(--panel);border-left:1px solid var(--line)}
.bs__qa{display:grid;gap:6px;max-height:38vh;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:10px}
.bs__qa h3{margin:0 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.bs__qa p{margin:0;font-size:12.5px;line-height:1.45}
.bs__ok{color:#15803d;font-weight:600}
.bs__w{padding:6px 8px;border-radius:7px}.bs__w--warn{background:#fef3c7;color:#78350f}.bs__w--error{background:#fee2e2;color:#7f1d1d}.bs__w small{opacity:.7;font-family:ui-monospace,monospace}
.bs__i{color:var(--ink-2)}
.bs__mods{display:flex;flex-wrap:wrap;gap:4px}.bs__mods .tag{font-family:ui-monospace,monospace;font-size:10.5px}
.bs__code-wrap{display:grid;grid-template-rows:auto auto 1fr;gap:8px;min-height:0}
.bs__code{margin:0;overflow:auto;min-height:0;padding:12px;border-radius:8px;background:#111318;color:#e6e6ea;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.bs__code--sm{max-height:60vh;font-size:11px}
.lib__tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}.lib__tabs button{border:0;background:none;padding:8px 9px;font-size:12px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer}.lib__tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brand)}
.lib__dacts{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:1200px){.bs{grid-template-columns:270px 1fr;grid-template-rows:56px 1fr auto}.bs__right{grid-column:1/-1;max-height:45vh}body{overflow:auto}}
.ss__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;overflow:auto;min-height:0;grid-row:3/5;align-content:start;padding-bottom:20px}.ss__card{display:grid;gap:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;cursor:pointer;text-align:left;transition:transform .25s,box-shadow .25s}.ss__card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgb(0 0 0/.4)}.ss__card img,.ss__ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;background:var(--line)}.ss__ph{display:grid;place-items:center;color:var(--ink-3)}.ss__card>span{display:grid;gap:2px;padding:10px 12px}.ss__card small{color:var(--ink-3);font-size:11.5px}.bs__stage{justify-self:center;transition:width .3s}
</style>
</head>
<body>
<script src="assets.js"></script>
<script src="section-studio.js"></script>
<script src="awd-ui.js"></script>
</body>
</html>
